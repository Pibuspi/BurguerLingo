<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Main-burguer.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="CHEF-DUO.PNG" type="image/png">

    <style>
        header {
            background-color: #08c958;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav a {
            font-size: 20px;
            color: white;
            text-decoration: none;
            margin-left: 30px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f5f2;
            margin: 0;
            padding: 0;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #08c958;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #08c958;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #06a546;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
<header>
    <img src="LogoBurguerDuo.png" alt="Logo da Empresa">
    <nav>
        <a href="cardapio.html">CARDÁPIOS</a>
        <a href="sobre nos.html">SOBRE NÓS</a>
        <a href="reservas.html">RESERVAS</a>
        <a href="fale conosco.html">FALE CONOSCO</a>
    </nav>
    <style>
        nav a {
            font-size: 20px; 
            color: white;
            text-decoration: none;
            margin-left: 100px;
        }
    </style>
</header>

<div class="box">
    <h2>Fale Conosco</h2>
    <form id="contatoForm" novalidate>
        <div class="input-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <div class="error" id="nomeError">Informe seu nome.</div>
        </div>

        <div class="input-group">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <div class="error" id="dataError">Você deve ter pelo menos 18 anos.</div>
        </div>

        <div class="input-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            <div class="error" id="emailError">Informe um e-mail válido.</div>
        </div>

        <div class="input-group">
            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" name="assunto" required>
            <div class="error" id="assuntoError">Informe o assunto.</div>
        </div>

        <div class="input-group">
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" required></textarea>
            <div class="error" id="mensagemError">Digite sua mensagem.</div>
        </div>

        <button type="submit">Enviar</button>
    </form>
</div>

<p style="text-align:center;">
    <a href="BURGUER LINGO.html" style="color:#08c958; font-weight:bold;">Voltar à Página Principal</a>
</p>

<footer>
    © 2025 Todos os direitos reservados
</footer>

<script>
document.getElementById('contatoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    let valid = true;

    const nome = document.getElementById('nome').value.trim();
    const dataNascimento = document.getElementById('dataNascimento').value;
    const email = document.getElementById('email').value.trim();
    const assunto = document.getElementById('assunto').value.trim();
    const mensagem = document.getElementById('mensagem').value.trim();

    const nomeError = document.getElementById('nomeError');
    const dataError = document.getElementById('dataError');
    const emailError = document.getElementById('emailError');
    const assuntoError = document.getElementById('assuntoError');
    const mensagemError = document.getElementById('mensagemError');

    nomeError.style.display = 'none';
    dataError.style.display = 'none';
    emailError.style.display = 'none';
    assuntoError.style.display = 'none';
    mensagemError.style.display = 'none';

    if (nome === '') {
        nomeError.style.display = 'block';
        valid = false;
    }

    if (dataNascimento) {
        const hoje = new Date();
        const dataNasc = new Date(dataNascimento);
        let idade = hoje.getFullYear() - dataNasc.getFullYear();
        const mes = hoje.getMonth() - dataNasc.getMonth();
        if (mes < 0 || (mes === 0 && hoje.getDate() < dataNasc.getDate())) {
            idade--;
        }
        if (idade < 18) {
            dataError.style.display = 'block';
            valid = false;
        }
    } else {
        dataError.style.display = 'block';
        valid = false;
    }

    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        emailError.style.display = 'block';
        valid = false;
    }

    if (assunto === '') {
        assuntoError.style.display = 'block';
        valid = false;
    }


    if (mensagem === '') {
        mensagemError.style.display = 'block';
        valid = false;
    }

    if (valid) {
        alert('Mensagem enviada com sucesso!');
        this.reset();
    }
});
</script>
</body>
</html>
