<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BurguerLingo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background-color: #f8f8f8;
    }
    header {
      background-color: #58cc02;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    h2 {
      margin-top: 30px;
      font-weight: normal;
    }
    .btn {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-green {
      background-color: #58cc02;
      color: white;
    }
    .btn-gray {
      background-color: #ccc;
      color: #333;
    }
    .flags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
      gap: 20px;
    }
    .flag-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      width: 120px;
      cursor: pointer;
      transition: 0.2s;
    }
    .flag-card:hover {
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }
    .flag-card img {
      width: 100%;
      border-radius: 4px;
    }
    .flag-card p {
      margin: 8px 0 0 0;
      font-weight: bold;
    }
    .flags {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* padrão: 4 colunas */
  gap: 20px;
  justify-items: center;
  max-width: 900px;
  margin: 10px auto;


}

/* Tablet: até 900px de largura → 3 colunas */
@media (max-width: 900px) {
  .flags {
    grid-template-columns: repeat(3, 1fr);
  }
}



/* Celular: até 600px de largura → 2 colunas */
@media (max-width: 600px) {
  .flags {
    grid-template-columns: repeat(2, 1fr);
  }
}

    footer {
      margin-top: 50px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
     BurguerLingo
  </header>

  <h2>O jeito grátis, divertido e saboroso de aprender um idioma!</h2>

  <button id="btn-comecar" class="btn btn-green">COMECE AGORA</button>
  <a href="BURGUER LINGO.html"class="btn btn-gray">VOLTAR</a>

<script>
  document.getElementById("btn-comecar").addEventListener("click", function() {
    alert("Selecione um idioma abaixo!");
  });
</script>

  <h2>Eu quero aprender...</h2>


<div class="flags">
  <a href="progresso.html?idioma=Inglês" class="flag-card">
    <img src="EUAflag.png" alt="Inglês">
    <p>Inglês</p>
  </a>
  <a href="progresso.html?idioma=Espanhol"  class="flag-card">
    <img src="espanha flag.jpg" alt="Espanhol">
    <p>Espanhol</p>
  </a>
  <a href="progresso.html?idioma=Francês"  class="flag-card">
    <img src="francaflag.png" alt="Francês">
    <p>Francês</p>
  </a>
  <a href="progresso.html?idioma=Italiano"  class="flag-card">
    <img src="italiaflag.png" alt="Italiano">
    <p>Italiano</p>
  </a>
  <a href="progresso.html?idioma=Alemão"  class="flag-card">
    <img src="alemanhaflag.jpeg" alt="Alemão">
    <p>Alemão</p>
  </a>
  <a href="progresso.html?idioma=Japônes"  class="flag-card">
    <img src="japanflag.jpeg" alt="Japonês">
    <p>Japonês</p>
  </a>
  <a href="progresso.html?idioma=Coreano"  class="flag-card">
    <img src="coreia do sul flag.jpg" alt="Coreano">
    <p>Coreano</p>
  </a>
  <a href="progresso.html?idioma=Chinês"  class="flag-card">
    <img src="chinaflag.png" alt="Chinês">
    <p>Chinês</p>
  </a>
</div>


  <footer>
    © 2025 Todos os direitos reservados
  </footer>
</body>
</html>
