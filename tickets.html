<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Cupons - Burguer Lingo</title>

    <link rel="stylesheet" href="Main-burguer.css">
    <link rel="stylesheet" href="burguer lingo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { background:#fafafa; font-family: Arial; margin:0; }
        .container { 
            max-width: 900px; 
            margin: 20px auto; 
            background:white; 
            padding:20px; 
            border-radius:12px; 
            box-shadow:0 6px 18px rgba(0,0,0,0.05);
        }
        h2 { color: orange; text-align:center; margin-bottom:20px; }
        .cupom {
            border:1px dashed orange;
            padding:18px;
            border-radius:12px;
            margin-bottom:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#fff8e7;
        }
        .cupom.used { opacity:0.45; background:#f2f2f2; }
        .cupom button {
            background:orange;
            color:white;
            padding:10px 14px;
            border:none;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
        }
        .cupom button:disabled {
            background:gray;
            cursor:not-allowed;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <button id="menu-btn" class="menu-hamburguer"><i class="fas fa-bars"></i></button>
        <a href="index.html" class="logo-link"><img src="LogoBurguerDuo.png" style="height:44px;"></a>
        <nav class="main-nav">
            <a href="cardapio.html">CARDÁPIO</a>
            <a href="licaoIdioma.html">LINGO LESSONS</a>
            <a href="reservas.html">RESERVAS</a>
        </nav>
    </header>

    <div class="container">
        <h2><i class="fas fa-ticket-alt"></i> Meus Cupons</h2>
        <div id="listaCupons"></div>
    </div>

    <script>
        function listarCupons() {
            const div = document.getElementById("listaCupons");
            const cupons = JSON.parse(localStorage.getItem("burguerLingoCoupons")) || [];
            const userCoupons = [
  { id: 1, code: "BRASIL10", discount: 10, used: false },
  { id: 2, code: "FRANCA10", discount: 10, used: false },
  { id: 3, code: "EUA10", discount: 10, used: false },
  { id: 4, code: "ESPANHA10", discount: 10, used: false },
  { id: 5, code: "JAPAO10", discount: 10, used: false },
  { id: 6, code: "ITALIA10", discount: 10, used: false },
  { id: 7, code: "CHINA10", discount: 10, used: false },
  { id: 8, code: "COREIA10", discount: 10, used: false },
  { id: 9, code: "ALEMANHA10", discount: 10, used: false }
];

localStorage.setItem("burguerLingoCoupons", JSON.stringify(userCoupons));

            if (cupons.length === 0) {
                div.innerHTML = "<p style='text-align:center;color:#777;'>Você não possui cupons ainda.</p>";
                return;
            }

            div.innerHTML = cupons.map(c => `
                <div class="cupom ${c.used ? 'used' : ''}">
                    <div>
                        <strong>${c.code}</strong><br>
                        Desconto: ${c.discount}%<br>
                        ${c.used ? "<span style='color:red;'>Já utilizado</span>" : ""}
                    </div>

                    <button onclick="usarCupom('${c.code}')" ${c.used ? "disabled" : ""}>
                        Usar
                    </button>
                </div>
            `).join("");
        }

        function usarCupom(codigo){

            alert("Cupom aplicado! Agora finalize sua compra no carrinho.");
            window.location.href = "carrinho.html";
        }

        listarCupons();
    </script>

</body>
</html>
