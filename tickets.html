<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Cupons - Burguer Lingo</title>

    <link rel="stylesheet" href="Main-burguer.css">
    <link rel="stylesheet" href="burguer lingo.css">
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { background:#fafafa; font-family: Arial; margin:0; }
        
        .container { 
            max-width: 900px; 
            margin: 20px auto; 
            background:white; 
            padding:20px; 
            border-radius:12px; 
            box-shadow:0 6px 18px rgba(0,0,0,0.05);
        }

        h2 { color: orange; text-align:center; margin-bottom:20px; }

        .cupom {
            border:1px dashed orange;
            padding:18px;
            border-radius:12px;
            margin-bottom:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#fff8e7;
        }

        .cupom.used { 
            opacity:0.45; 
            background:#f2f2f2; 
        }

        .cupom button {
            background:orange;
            color:white;
            padding:10px 14px;
            border:none;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
        }

        .cupom button:disabled {
            background:gray;
            cursor:not-allowed;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <button id="menu-btn" class="menu-hamburguer"><i class="fas fa-bars"></i></button>
        <a href="index.html" class="logo-link">
            <img src="LogoBurguerDuo.png" style="height:44px;">
        </a>
        <nav class="main-nav">
            <a href="cardapio.html">CARDÁPIO</a>
            <a href="licaoIdioma.html">LINGO LESSONS</a>
            <a href="reservas.html">RESERVAS</a>
        </nav>
    </header>

    <div class="container">
        <h2><i class="fas fa-ticket-alt"></i> Meus Cupons</h2>

        <div id="listaCupons"></div>
    </div>

<script>
function carregarCupons() {
    const listaDiv = document.getElementById("listaCupons");

    // pega cupons no formato A:
    let cuponsBrutos = JSON.parse(localStorage.getItem("cupons")) || [];

    // converte para formato utilizável:
    let cupons = cuponsBrutos.map(c => ({
        codigo: c.codigo,
        desconto: c.codigo.includes("5") ? 5 :
                  c.codigo.includes("10") ? 10 :
                  c.codigo.includes("15") ? 15 : 0,
        usado: c.usado || false
    }));

    listaDiv.innerHTML = "";

    if (cupons.length === 0) {
        listaDiv.innerHTML = "<p style='text-align:center;color:#777;'>Você ainda não possui tickets.</p>";
        return;
    }

    cupons.forEach(c => {
        const div = document.createElement("div");
        div.className = "cupom " + (c.usado ? "used" : "");

        div.innerHTML = `
            <div>
                <strong>${c.codigo}</strong><br>
                Desconto: ${c.desconto}%<br>
                ${c.usado ? "<span style='color:red;'>Usado</span>" : ""}
            </div>

            <button ${c.usado ? "disabled" : ""} onclick="usarCupom('${c.codigo}')">
                Usar Ticket
            </button>
        `;

        listaDiv.appendChild(div);
    });

    // salva formato limpo de volta
    localStorage.setItem("cupons_limpos", JSON.stringify(cupons));
}

function usarCupom(codigo) {
    localStorage.setItem("cupomSelecionado", codigo);
    alert("Ticket aplicado! Vá ao carrinho para usar o desconto.");
    window.location.href = "carrinho.html";
}

carregarCupons();
</script>



</body>
</html>
