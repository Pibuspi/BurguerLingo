<body>
    
    <div id="sidebar" class="menu-lateral">

        <a href="login.html"><i class="fas fa-user-circle"></i> Login</a>
        <a href="cardapio.html"><i class="fas fa-burger"></i> Cardápio</a>
        <a href="licao.html"><i class="fas fa-book-open"></i> Lingo Lessons (Lições)</a>
        <a href="reservas.html"><i class="fas fa-table"></i> Reservas</a>
        <a href="fale conosco.html"><i class="fas fa-headset"></i> Fale Conosco</a>

        <a href="ajudajeff.html"><i class="fas fa-question-circle"></i> Perguntas Frequentes</a>

</body>
   <script>
    // JS para o Menu Lateral (Sidebar)
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const sidebar = document.getElementById('sidebar');

    // Toggle a classe 'active' para mostrar/esconder o menu lateral
    menuBtn.addEventListener('click', () => {
        sidebar.classList.add('active');
    });
    closeBtn.addEventListener('click', () => {
        sidebar.classList.remove('active');
    });
    </script>
