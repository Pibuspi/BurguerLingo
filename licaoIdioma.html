<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Lição - Burguer Lingo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="CHEF+DUO .png" type="image/png">
  <link rel="stylesheet" href="duolicao.css"> <!-- seu CSS -->
  <style>
    /* Pequeno ajuste visual local (pode manter no CSS externo se preferir) */
    body { font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, Arial; background: #f6fff6; margin:0; }
    .conteudo-licao{ max-width:1100px; margin:26px auto; padding:18px; display:flex; flex-direction:column; gap:18px; }
    #boxPersonagem { display:flex; justify-content:center; margin-bottom:6px; }
    #personagemImg { width:140px; height:140px; object-fit:cover; border-radius:12px; }
    #personagemAnim { width:140px; border-radius:12px; display:none; }
    #container { background:#fff; padding:20px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.06); text-align:center; }
    #frase { font-weight:700; font-size:20px; margin-bottom:10px; color:#133A13; }
    #linha { font-size:20px; font-weight:700; margin-bottom:14px; color:#0b4220; min-height:32px; }
    .opcoes { display:flex; flex-direction:column; gap:10px; margin:0 auto; max-width:720px; }
    .opcao { background:#f6fffa; padding:12px 14px; border-radius:12px; cursor:pointer; border:1px solid rgba(0,0,0,0.04); font-weight:600; }
    .opcao.selecionada { box-shadow:0 8px 20px rgba(0,0,0,0.06); transform:translateY(-4px); }
    .opcao.errada { background: linear-gradient(90deg,#fff0f0,#ffecec); color:#8a1e1e; }
    .opcao.correta { background: linear-gradient(90deg,#e3fff0,#caf9d6); color:#0b5a28; }
    .rodape{ display:flex; gap:12px; justify-content:center; margin-top:16px; }
    .btn{ border:0; padding:10px 18px; border-radius:12px; cursor:pointer; font-weight:700; }
    .btn-pular{ background:transparent; color:#2e8f2e; border:2px solid rgba(30,120,30,0.08); }
    .btn-verificar{ background: linear-gradient(90deg,#58cc02,#44a003); color:#fff; }
    #telaCarregamento{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2000; background:white; flex-direction:column; }
    #telaFinal, #telaMalfim { display:none; }
    .progresso-outer{ width:100%; max-width:720px; margin:0 auto; height:12px; background:#eee; border-radius:999px; overflow:hidden; }
    .progresso-inner{ height:100%; width:0%; background:linear-gradient(90deg,#58cc02,#89ff4f); transition:width .45s ease; }
    #coracoes-container{ display:flex; gap:8px; align-items:center; justify-content:center; }
  </style>
</head>
<body id="licaoPage">

  <!-- LOADING -->
  <div id="telaCarregamento">
    <img src="carregando.jpeg" alt="Carregando" style="width:120px;height:120px;border-radius:12px;margin-bottom:10px;">
    <h2>Carregando lição...</h2>
  </div>

  <!-- HEADER (progresso + vidas) -->
  <header class="header-licao" style="margin:18px auto; max-width:1100px;">
      <div class="progresso-outer">
        <div id="progresso" class="progresso-inner"></div>
      </div>
      <div id="coracoes-container"></div>
  </header>

  <!-- CONTEÚDO -->
  <main id="telaLicao" class="conteudo-licao" style="display:none;">
    <div id="boxPersonagem">
      <img id="personagemImg" src="" alt="personagem parado">
      <video id="personagemAnim" muted playsinline></video>
    </div>

    <div id="container">
      <div id="frase" class="pergunta"></div>
      <div id="linha"></div>

      <div id="opcoes" class="opcoes"></div>

      <div class="rodape" style="margin-top:18px;">
        <button id="pular" class="btn btn-pular">Pular</button>
        <button id="btnConfirmar" class="btn btn-verificar">Confirmar</button>
      </div>
    </div>
  </main>

  <!-- TELA FINAL BOM -->
  <div id="telaFinal" style="max-width:900px;margin:28px auto;text-align:center;">
    <h1>🎉 Parabéns! Você concluiu a lição!</h1>
    <p id="cupomMensagem"></p>
    <div style="margin-top:16px;">
      <button class="btn btn-verificar" onclick="location.href='pagina_das_licoes.html'">Voltar às lições</button>
      <button class="btn" onclick="location.href='tickets.html'">Meus cupons</button>
    </div>
  </div>

  <!-- TELA FINAL RUIM -->
  <div id="telaMalfim" style="max-width:900px;margin:28px auto;text-align:center;">
    <h1>😕 Você ficou sem vidas</h1>
    <p>Tente novamente mais tarde.</p>
    <div style="margin-top:16px;">
      <button class="btn btn-verificar" onclick="location.href='pagina_das_licoes.html'">Voltar</button>
    </div>
  </div>

  <!-- scripts: etapas.js (seu) deve estar disponível -->
  <script src="etapas.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
