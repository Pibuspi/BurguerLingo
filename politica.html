    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBtHw7TqCac0SWil2T-7qvfUckDps_uDWI",
    authDomain: "burguer-lingo-402c0.firebaseapp.com",
    projectId: "burguer-lingo-402c0",
    storageBucket: "burguer-lingo-402c0.firebasestorage.app",
    messagingSenderId: "1057314729279",
    appId: "1:1057314729279:web:82f3ae4a2447001f80f78a",
    measurementId: "G-C2T4FRDYQ4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🟢 Verifica se o usuário está logado
onAuthStateChanged(auth, (user) => {
    const greeting = document.getElementById("userGreeting");
    const loginIcon = document.getElementById("loginIcon");

    if (user) {
        // Se tiver displayName usa, senão usa só o email
        const nome = user.displayName || user.email.split("@")[0];

        greeting.textContent = `Olá, ${nome}!`;
        loginIcon.style.display = "none"; // Esconde o ícone de login
    } else {
        greeting.textContent = ""; // Não mostra nada
        loginIcon.style.display = "inline-block"; // Mostra o ícone de login
    }
});
</script>

   <script>
    // JS para o Menu Lateral (Sidebar)
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const sidebar = document.getElementById('sidebar');

    // Toggle a classe 'active' para mostrar/esconder o menu lateral
    menuBtn.addEventListener('click', () => {
        sidebar.classList.add('active');
    });
    closeBtn.addEventListener('click', () => {
        sidebar.classList.remove('active');
    });
    </script>
