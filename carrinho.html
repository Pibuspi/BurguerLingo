<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Burguer Lingo</title>

    <link rel="stylesheet" href="Main-burguer.css">
    <link rel="stylesheet" href="burguer lingo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<header class="main-header">
    <button id="menu-btn" class="menu-hamburguer"><i class="fas fa-bars"></i></button>
    <a href="index.html" class="logo-link"><img src="LogoBurguerDuo.png" style="height:44px;"></a>
    <nav class="main-nav">
        <a href="cardapio.html">CARDÁPIO</a>
        <a href="licaoIdioma.html">LINGO LESSONS</a>
        <a href="reservas.html">RESERVAS</a>
    </nav>
</header>

<div class="cart-container">
    <h2 class="cart-title">Seu Carrinho</h2>
    <div id="cart-items"></div>

    <div class="summary-box">
        <h3>Resumo da compra</h3>

        <div id="summaryArea"></div>

        <div class="payment-buttons">
            <button onclick="confirmPayment('cartao')">Confirmar com Cartão</button>
            <button onclick="confirmPayment('dinheiro')">Confirmar e Pagar em Dinheiro</button>
        </div>
    </div>
</div>

<script>

/* -------------------------------
   CARREGAR CARRINHO
--------------------------------*/
function loadCart() {
    return JSON.parse(localStorage.getItem("burguerLingoCart")) || [];
}

function saveCart(cart) {
    localStorage.setItem("burguerLingoCart", JSON.stringify(cart));
}

/* -------------------------------
   FORMATAR PREÇO
--------------------------------*/
function formatCurrency(value) {
    return value.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });
}

/* -------------------------------
   REMOVER ITEM
--------------------------------*/
function removeItem(id) {
    let cart = loadCart();
    cart = cart.filter(item => item.id !== id);
    saveCart(cart);
    renderCart();
}

/* -------------------------------
   RENDERIZAR CARRINHO
--------------------------------*/
function renderCart() {
    const cartItems = document.getElementById("cart-items");
    const summaryArea = document.getElementById("summaryArea");

    let cart = loadCart();

    if (cart.length === 0) {
        cartItems.innerHTML = "<p class='empty'>Seu carrinho está vazio.</p>";
        summaryArea.innerHTML = "";
        return;
    }

    cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
            <img src="${item.imagem}" class="item-img">
            <div class="item-info">
                <h3>${item.nome}</h3>
                <p>${item.descricao}</p>
                <p>${formatCurrency(item.preco)}</p>
            </div>
            <button class="remove" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
        </div>
    `).join("");

    /* CÁLCULO DO TOTAL */
    let subtotal = cart.reduce((acc, item) => acc + item.preco, 0);

    /* -------------------------------
       APLICAR CUPOM SELECIONADO
    --------------------------------*/
    let cupomSelecionado = localStorage.getItem("cupomSelecionado");
    let descontoCupom = 0;

    if (cupomSelecionado) {
        const cupons = JSON.parse(localStorage.getItem("burguerLingoCoupons")) || [];
        const cupom = cupons.find(c => c.code === cupomSelecionado && !c.used);
        if (cupom) descontoCupom = cupom.discount;
    }

    let totalFinal = subtotal;
    if (descontoCupom > 0) {
        totalFinal = subtotal - (subtotal * (descontoCupom / 100));
    }

    summaryArea.innerHTML = `
        <div class="summary-line">
            <span>Subtotal:</span>
            <strong>${formatCurrency(subtotal)}</strong>
        </div>

        ${descontoCupom > 0 ? `
        <div class="summary-line">
            <span>Cupom (${cupomSelecionado}):</span>
            <strong>- ${descontoCupom}%</strong>
        </div>
        ` : ""}

        <div class="summary-total">
            <span>Total Final:</span>
            <strong>${formatCurrency(totalFinal)}</strong>
        </div>
    `;
}

/* -------------------------------
   CONFIRMAR PAGAMENTO
--------------------------------*/
function confirmPayment(tipo) {
    alert("Pagamento confirmado!");

    /* MARCAR CUPOM COMO USADO */
    let cupomSel = localStorage.getItem("cupomSelecionado");
    if (cupomSel) {
        let cupons = JSON.parse(localStorage.getItem("burguerLingoCoupons")) || [];
        const idx = cupons.findIndex(c => c.code === cupomSel);
        if (idx > -1) cupons[idx].used = true;
        localStorage.setItem("burguerLingoCoupons", JSON.stringify(cupons));
        localStorage.removeItem("cupomSelecionado");
    }

    /* LIMPAR CARRINHO */
    localStorage.removeItem("burguerLingoCart");

    window.location.href = "index.html";
}

renderCart();
</script>

</body>
</html>
