</head>
<style>
body {
  font-family: arial, helvetica, sans-serif;
  background-image: #ffffff
}

box {
  background-color: #ffffff
}
</style> 
<body>
<header>
    <img src="LogoBurguerDuo.png" alt="Logo da Empresa">
    <nav>
    <a href="cardapio.html">CARDÁPIOS</a>

    </nav>
    <style> nav a {
        font-size: 20px; /* altera o tamanho da fonte */
       color: white;
       text-decoration: none;
       margin-left: 100px; /* Espaçamento entre os links */
   }
    </style>
   
</header>

<section class="info">
    <p>Formulário de Reservas (confirmações, trocas e cancelamentos via e-mail ou whatsapp)</p>
    <p>Endereço: Rua Jair Bolsonaro, 222, Jardim Bostil, Guarulhos</p>
</section>

<div class="box">
    <form id="Formulario" autocomplete="off">
        <fieldset>
           <div class="inputbox">
            <label for="NOME"><font color="#08c958">Nome:</font></label>
            <input type="text" id="NOME" name="nome" required>
           </div>
          <br>
             <div class="inputbox">
            <label for="TELEFONE"><font color="#08c958">Telefone:</font></label>
            <input type="tel" id="TELEFONE" name="telefone" required>
          </div>
          <br>
            <label for="EMAIL"><font color="#08c958">Email:</font></label>
            <input type="email" id="EMAIL" name="email" required>
          <br><br>
          <div class="inputbox">
            <label for="data"><font color="#08c958">Data (DD/MM/AAAA):</font></label>
            <input type="date" id="data" name="data" required>
          </div>
          <br>
          <div>
            <label for="HORARIO"><font color="#08c958">Horário:</font></label>
            <select id="HORARIO" name="HORARIO" required>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
            </select>
          </div>
          <br>
            <button type="submit">Reservar</button>
        </fieldset>
    </form>
</div>

</body>
